# nao.bukivo.com — gemelo digital web del NAO V6 (SPA estática de Vite).
# Copia en el servidor: /etc/nginx/sites-available/nao.bukivo.com (symlink en sites-enabled).
# Este archivo es la fuente de verdad: `bash scripts/deploy.sh nginx` lo sube, hace `nginx -t` y recarga.
#
# Web root: /var/www/nao.bukivo.com  (bash scripts/deploy.sh prod)
#
# TLS: wildcard Cloudflare Origin (*.bukivo.com, el mismo de portal.bukivo.com). Solo funciona
# mientras el registro DNS esté PROXIED (nube naranja): no es un certificado de CA pública.

server {
    listen 80;
    server_name nao.bukivo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nao.bukivo.com;

    ssl_certificate     /etc/ssl/cloudflare/app.bukivo.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/app.bukivo.com.key;

    root /var/www/nao.bukivo.com;
    index index.html;

    # ─── Cloudflare real IP ──────────────────────────────────────────────────
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Cámara y micrófono (visión y audio en vivo) solo para este mismo origen
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;
    # Proyecto académico en construcción: fuera de buscadores
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Aislamiento de origen (crossOriginIsolated): habilita SharedArrayBuffer y los hilos de WebAssembly
    # de la voz (Kokoro sin GPU). Todo se sirve desde este origen; Hugging Face responde con CORS.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain application/wasm model/vnd.collada+xml;

    # index.html nunca se cachea; Vite pone hash de contenido en /assets/*
    # (un add_header dentro de location anula los del server: se repiten los que importan)
    location = /index.html {
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(self), microphone=(self)" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # El worker de la voz sale de aquí: su script también debe declarar el aislamiento
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        try_files $uri =404;

        # MuJoCo (física): el navegador solo compila en streaming si el MIME es application/wasm,
        # y nginx 1.18 no lo trae. Va anidado porque ^~ impide que aplique el bloque .wasm de abajo.
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    # nginx 1.18 no trae .mjs ni .wasm en mime.types (Pyodide los necesita en F4)
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }

    # Mallas oficiales del NAO (Collada, XML): 11 MB sin comprimir, nginx 1.18 no conoce .dae
    location ~* \.dae$ {
        types { }
        default_type model/vnd.collada+xml;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Modelos 3D (Meshy, .glb) con nombre fijo: revalidan por ETag en cada carga
    location ~* \.(glb|gltf|urdf|motion)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nao-api (server/, PM2, 127.0.0.1:3030): login, sesión y salas del teléfono. La IP real llega en X-Real-IP
    # ($remote_addr ya viene de CF-Connecting-IP por real_ip_header).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        # Foto de perfil (PATCH /api/me) y archivos de la biblioteca (POST /api/documents, ≤ 4 MB + miniatura)
        client_max_body_size 5m;
    }
    # WebSockets: la sala del teléfono por QR (vista del NAO en JPEG: mensajes de hasta 512 KB) y la sala del mundo
    # compartido (plan B en nao-api mientras no esté la de Cloudflare, server/world.go)
    location ~ ^/api/(ws|world)$ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA: cualquier ruta que no sea archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
